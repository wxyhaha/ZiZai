<text x="1317" y="483" text-anchor="middle" fill="#322E2A" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="25" font-weight="400" letter-spacing="0" opacity="1">≡</text>
<text x="1317" y="506" text-anchor="middle" fill="#897E70" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="13" font-weight="400" letter-spacing="1" opacity="1">排版</text>
<text x="1317" y="558" text-anchor="middle" fill="#322E2A" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="25" font-weight="400" letter-spacing="0" opacity="1">✎</text>
<text x="1317" y="581" text-anchor="middle" fill="#897E70" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="13" font-weight="400" letter-spacing="1" opacity="1">题写</text>
<text x="1317" y="633" text-anchor="middle" fill="#322E2A" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="25" font-weight="400" letter-spacing="0" opacity="1">□</text>
<text x="1317" y="656" text-anchor="middle" fill="#897E70" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="13" font-weight="400" letter-spacing="1" opacity="1">对照</text>
<text x="1317" y="708" text-anchor="middle" fill="#322E2A" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="25" font-weight="400" letter-spacing="0" opacity="1">♡</text>
<text x="1317" y="731" text-anchor="middle" fill="#897E70" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="13" font-weight="400" letter-spacing="1" opacity="1">收藏</text>
</g>
