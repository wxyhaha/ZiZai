<g id="reading-paper">
<rect x="84" y="224" width="1153" height="566" rx="3" fill="#F6F1E7" stroke="#DFD6C8" stroke-width="1" opacity="1"/>
<rect x="85" y="225" width="1151" height="564" rx="0" fill="url(#paper)" stroke="none" stroke-width="1" opacity="1"/>
<text x="660" y="327" text-anchor="middle" fill="#322E2A" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="39" font-weight="400" letter-spacing="6" opacity="1">项脊轩志</text>
<text x="660" y="371" text-anchor="middle" fill="#897E70" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="16" font-weight="400" letter-spacing="5" opacity="1">归有光</text>
<text x="260" y="439" text-anchor="start" fill="#443A32" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="22" font-weight="400" letter-spacing="1.2" opacity="1">项脊轩，旧南阁子也。室仅方丈，可容一人居。</text>
<text x="260" y="486" text-anchor="start" fill="#443A32" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="22" font-weight="400" letter-spacing="1.2" opacity="1">百年老屋，尘泥渗漉，雨泽下注；每移案，顾视无</text>
<text x="260" y="533" text-anchor="start" fill="#443A32" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="22" font-weight="400" letter-spacing="1.2" opacity="1">可置者。又北向，不能得日，日过午已昏。余稍</text>
<text x="260" y="580" text-anchor="start" fill="#443A32" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="22" font-weight="400" letter-spacing="1.2" opacity="1">为修葺，使不上漏。</text>
<text x="260" y="627" text-anchor="start" fill="#443A32" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="22" font-weight="400" letter-spacing="1.2" opacity="1">前辟四窗，垣墙周庭，以当南日，日影反照，</text>
<text x="260" y="674" text-anchor="start" fill="#443A32" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="22" font-weight="400" letter-spacing="1.2" opacity="1">室始洞然。又杂植兰桂竹木于庭，旧时栏楯，亦</text>
<text x="260" y="721" text-anchor="start" fill="#443A32" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="22" font-weight="400" letter-spacing="1.2" opacity="1">遂增胜。借书满架，偃仰啸歌，冥然兀坐。</text>
</g>
