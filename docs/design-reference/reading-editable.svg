<text x="502" y="174" text-anchor="start" fill="#897E70" font-family="&#x27;Noto Serif CJK SC&#x27;, &#x27;Songti SC&#x27;, &#x27;SimSun&#x27;, serif" font-size="21" font-weight="400" letter-spacing="0" opacity="1">⌄</text>
