<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>字在 ZiZai — 交互设计稿</title>
  <style>
    :root{--paper:#F7F4EC;--paper-deep:#EFE8DB;--ink:#322E2A;--muted:#8C8072;--line:#DCD3C6;--accent:#9A5548;--accent-light:#F0E0DA;--ui:#FBF9F4;--shadow:0 12px 45px rgba(58,47,35,.055);--serif:"Noto Serif CJK SC","Songti SC","STSong","SimSun",serif;--sans:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:var(--sans);color:var(--ink)} body{background:#e8e3d9} button,textarea,input{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px} .app{min-height:100vh;background:var(--paper);position:relative;overflow:hidden}
    .grain:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.3;background-image:radial-gradient(rgba(84,67,50,.09) .55px,transparent .95px),radial-gradient(rgba(146,126,98,.08) .55px, transparent .95px);background-size:8px 8px,13px 13px;background-position:0 0,6px 4px;z-index:0}
    .grain>*{position:relative;z-index:1}.topbar{height:92px;display:flex;align-items:center;justify-content:space-between;max-width:1540px;margin:auto;padding:0 6%;position:relative;z-index:10}.wordmark{border:0;background:none;font-family:var(--serif);font-size:29px;font-weight:600;letter-spacing:.12em;padding:8px 0;color:var(--ink);display:flex;gap:13px;align-items:center}.wordmark small{font-family:serif;font-size:9px;color:var(--accent);line-height:1.35;writing-mode:vertical-rl;letter-spacing:2px}.topnav{display:flex;align-items:center;gap:36px}.nav-btn{border:0;background:transparent;padding:8px 0 11px;color:#84776b;letter-spacing:.19em;font-family:var(--serif);font-size:14px;position:relative}.nav-btn.active{color:var(--ink)}.nav-btn.active:after{content:"";position:absolute;bottom:2px;left:0;right:3px;height:1px;background:var(--accent)}.icon-btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--ink);width:35px;height:35px;border-radius:6px}.icon-btn:hover,.rail-btn:hover,.toolbar-btn:hover{background:#EEE7DA}svg.i{height:18px;width:18px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .view{min-height:calc(100vh - 92px)}.view[hidden]{display:none!important}
    .home{height:calc(100vh - 92px);min-height:580px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;isolation:isolate}.hero{text-align:center;transform:translateY(-18px);z-index:2}.eyebrow{font-family:var(--serif);font-size:13px;letter-spacing:.35em;color:var(--accent);margin-bottom:35px}.hero h1{font-family:var(--serif);font-size:clamp(76px,11vw,152px);font-weight:500;letter-spacing:.15em;margin:0 0 13px;line-height:1.35;text-indent:.15em}.hero .tagline{font-family:var(--serif);font-size:19px;letter-spacing:.35em;color:#5E534A;margin-bottom:23px}.ornamental-line{height:37px;width:1px;background:#C3A69A;margin:0 auto 23px}.hero .subtitle{font-family:var(--serif);font-size:13px;color:#908478;letter-spacing:.32em}.enter{margin-top:39px;background:transparent;border:1px solid var(--accent);color:var(--accent);font-family:var(--serif);font-size:16px;padding:15px 44px;letter-spacing:.22em;transition:background .2s,color .2s}.enter:hover{background:var(--accent);color:white}.enter .arrow{margin-left:20px;font-family:var(--sans)}.drift{position:absolute;font-family:var(--serif);color:#B1A496;user-select:none;pointer-events:none;opacity:.43;z-index:1;animation:floatdown var(--dur,24s) linear infinite;animation-delay:var(--delay,0s);top:-10%;left:var(--left);font-size:var(--size,24px)}@keyframes floatdown{0%{transform:translate(0,-9vh) rotate(-6deg);opacity:0}14%{opacity:.38}82%{opacity:.28}100%{transform:translate(28px,110vh) rotate(11deg);opacity:0}}.home-foot{position:absolute;bottom:44px;left:6%;right:6%;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;letter-spacing:.2em}.home-foot .footlinks{display:flex;gap:27px}.footlinks button{border:0;background:none;color:var(--muted);font-size:12px;letter-spacing:.16em}.footlinks button:hover{color:var(--accent)}
    .studio{padding:17px 6% 45px;max-width:1540px;margin:auto;height:calc(100vh - 92px);min-height:650px;display:flex;flex-direction:column}.studio-top{display:flex;gap:14px;align-items:center;justify-content:space-between;padding-bottom:25px;border-bottom:1px solid var(--line)}.selects,.modes{display:flex;gap:12px;align-items:center}.toolbar-btn{min-width:178px;display:flex;align-items:center;justify-content:space-between;gap:20px;border:1px solid var(--line);border-radius:6px;padding:12px 15px;background:#F8F5EF;color:#5D5249;font-family:var(--serif);font-size:13px}.modes{gap:6px}.modebtn{border:0;background:transparent;color:var(--muted);padding:11px 14px;font-family:var(--serif);font-size:13px;letter-spacing:.09em;border-radius:4px}.modebtn.selected{color:var(--ink);background:#EEE7DE}.modebtn svg{vertical-align:-4px;margin-right:5px}
    .workspace{display:flex;flex:1;min-height:0;gap:22px;padding-top:27px}.sheet{border:1px solid #DAD0C0;background:#F6F1E7;flex:1;position:relative;overflow:auto;box-shadow:var(--shadow);scrollbar-color:#D7CDBE transparent}.sheet:before{content:"";pointer-events:none;position:absolute;inset:0;background:radial-gradient(rgba(138,111,82,.058) .5px,transparent 1px);background-size:9px 9px;opacity:.23}.sheet-inner{position:relative;min-height:100%;padding:55px 9% 50px;display:flex;flex-direction:column;align-items:center}.article-head{text-align:center;margin:0 0 42px}.article-head h2{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:.14em;margin:0 0 16px}.article-head .author{font-family:var(--serif);font-size:13px;letter-spacing:.22em;color:#928578}.prose{font-family:var(--serif);font-size:var(--font-size,20px);line-height:var(--line-height,2.2);letter-spacing:.035em;max-width:790px;width:100%;color:#3A342F}.prose p{margin:0 0 1.2em;text-indent:2em}.sheet[data-layout=vertical] .sheet-inner{align-items:stretch;overflow:hidden;min-height:560px}.sheet[data-layout=vertical] .article-head{display:none}.sheet[data-layout=vertical] .prose{writing-mode:vertical-rl;text-orientation:mixed;max-width:none;min-width:0;width:100%;height:100%;max-height:540px;overflow:auto;line-height:2.35;letter-spacing:.06em;scrollbar-width:thin}.sheet[data-layout=vertical] .prose p{margin:0 0 0 1.6em;text-indent:2em}.sheet[data-layout=vertical] .vertical-title{display:flex}.vertical-title{display:none;position:absolute;right:14px;top:24px;writing-mode:vertical-rl;font-family:var(--serif);font-size:22px;letter-spacing:.1em;color:#736052}.side-rail{width:70px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:7px 0;gap:5px}.rail-btn{border:0;background:transparent;color:#776A5F;padding:12px 4px 10px;width:64px;display:flex;flex-direction:column;align-items:center;gap:7px;border-radius:4px;font-size:11px;letter-spacing:.13em}.rail-btn svg{width:18px;height:18px}.studio-foot{height:54px;padding-top:18px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.step-control{display:flex;align-items:center;gap:18px}.step-control button{border:1px solid var(--line);background:transparent;width:28px;height:28px;border-radius:50%;color:var(--muted)}.type-control{display:flex;gap:16px;align-items:center}.type-control input{accent-color:var(--accent);width:130px}
    .scrim{position:fixed;inset:0;background:rgba(31,25,20,.21);z-index:49;display:none}.scrim.visible{display:block}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(450px,100vw);background:#F9F6EF;z-index:50;transform:translateX(101%);transition:transform .3s ease;box-shadow:-15px 0 65px rgba(30,20,10,.1);display:flex;flex-direction:column}.drawer.open{transform:translateX(0)}.drawer-head{padding:29px 30px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.drawer-head h3{font-family:var(--serif);font-size:24px;letter-spacing:.13em;font-weight:500;margin:0}.drawer-body{padding:25px 30px 34px;overflow:auto;flex:1}.drawer .muted{color:var(--muted);font-size:13px;line-height:1.9}.menu-list{display:grid;gap:12px;margin-top:25px}.menu-item{border:1px solid var(--line);border-radius:6px;background:#F7F3EA;text-align:left;padding:21px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.menu-item.active{border-color:var(--accent);background:#F7EEE7}.menu-item span{display:block;font-family:var(--serif);font-size:19px;letter-spacing:.1em}.menu-item small{display:block;margin-top:7px;font-size:11px;color:var(--muted)}.menu-item strong{font-family:var(--serif);font-weight:400;font-size:26px}.choice-row{display:flex;gap:11px;flex-wrap:wrap;margin:14px 0 27px}.chip{padding:10px 14px;border:1px solid var(--line);background:transparent;border-radius:4px;color:var(--ink);font-size:13px}.chip.active{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}.form-row{margin:29px 0}.form-row label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:13px}.form-row input{width:100%;accent-color:var(--accent)}.field{width:100%;border:1px solid var(--line);background:#FFFDF8;padding:13px;min-height:170px;resize:vertical;font-family:var(--serif);line-height:2}.action{border:1px solid var(--accent);background:var(--accent);color:white;padding:12px 20px;font-family:var(--serif);letter-spacing:.15em}.action.secondary{background:transparent;color:var(--accent)}.detail-name{font-family:var(--serif);font-size:46px;text-align:center;padding:26px 0 10px}.info-pair{padding:15px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:80px 1fr;gap:14px;font-size:13px;line-height:1.7}.info-pair .k{color:var(--muted)}.compare-view{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;min-height:0}.compare-sheet{border:1px solid var(--line);background:#F6F1E7;padding:35px;overflow:auto;font-family:var(--serif);line-height:2.2;font-size:19px}.compare-sheet h3{font-family:var(--serif);font-size:20px;font-weight:500}.compare-sheet.kaiti{font-family:"KaiTi","STKaiti",serif}.tiny{font-size:11px;color:var(--muted);line-height:1.7}.switch-line{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);gap:16px}.empty{display:grid;place-items:center;min-height:140px;color:var(--muted);font-family:var(--serif)}
    @media(max-width:780px){.topbar{height:72px;padding:0 20px}.wordmark{font-size:24px}.topnav{gap:19px}.nav-btn{font-size:13px}.view{min-height:calc(100dvh - 72px)}.home{height:calc(100dvh - 72px);min-height:530px}.hero{transform:translateY(-15px)}.eyebrow{font-size:10px;letter-spacing:.23em;margin-bottom:24px}.hero h1{font-size:79px}.hero .tagline{font-size:15px}.home-foot{bottom:20px;left:22px;right:22px;font-size:10px}.home-foot .footlinks{gap:10px}.footlinks button{font-size:10px}.studio{padding:12px 16px 18px;height:calc(100dvh - 72px);min-height:550px}.studio-top{gap:9px;padding-bottom:16px}.toolbar-btn{min-width:auto;width:137px;font-size:11px;padding:10px}.selects{gap:7px}.modebtn{font-size:0;padding:8px}.modebtn svg{margin:0}.workspace{padding-top:13px;gap:8px}.side-rail{width:46px}.rail-btn{width:44px;padding:10px 2px;font-size:9px}.rail-btn svg{width:17px;height:17px}.sheet-inner{padding:30px 7%}.article-head h2{font-size:26px}.article-head{margin-bottom:30px}.prose{font-size:var(--font-size,17px);line-height:2}.studio-foot{height:50px}.type-control input{width:72px}.drawer-head{padding:22px}.drawer-body{padding:20px}.drift{display:none}.drift:nth-of-type(-n+4){display:block}}
    @media(max-width:450px){.topnav{gap:13px}.home-foot .footlinks{gap:8px}.hero h1{font-size:68px}.hero .tagline{font-size:13px}.toolbar-btn{width:116px;gap:4px}.modebtn{padding:7px}.studio{min-height:580px}.prose{font-size:var(--font-size,16px)}.sheet[data-layout=vertical] .prose{max-height:460px}.rail-btn{padding:7px 2px}.side-rail{width:43px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}.drift{display:none}}
    @media print{.topbar,.studio-top,.side-rail,.studio-foot,.drawer,.scrim{display:none!important}.studio{padding:0;height:auto}.workspace{padding:0}.sheet{box-shadow:none;border:0}.app{background:white}}
  </style>
</head>
<body>
<div class="app grain" id="app">
  <header class="topbar">
    <button class="wordmark" onclick="showView('home')" aria-label="回到首页">字在 <small>ZiZai</small></button>
    <nav class="topnav" aria-label="主导航">
      <button class="nav-btn active" id="nav-home" onclick="showView('home')">首页</button>
      <button class="nav-btn" id="nav-studio" onclick="showView('studio')">赏字</button>
      <button class="icon-btn" aria-label="关于项目" title="关于" onclick="openPanel('about')"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </nav>
  </header>
  <section id="home" class="home view" aria-label="字在首页">
    <span class="drift" style="--left:13%;--size:43px;--dur:27s;--delay:-11s">月</span>
    <span class="drift" style="--left:77%;--size:26px;--dur:30s;--delay:-24s">书</span>
    <span class="drift" style="--left:85%;--size:36px;--dur:39s;--delay:-13s">墨</span>
    <span class="drift" style="--left:11%;--size:28px;--dur:35s;--delay:-29s">风</span>
    <span class="drift" style="--left:29%;--size:23px;--dur:30s;--delay:-7s">竹</span>
    <span class="drift" style="--left:61%;--size:19px;--dur:28s;--delay:-19s">云</span>
    <span class="drift" style="--left:92%;--size:20px;--dur:34s;--delay:-4s">山</span>
    <span class="drift" style="--left:35%;--size:34px;--dur:38s;--delay:-33s">纸</span>
    <span class="drift" style="--left:5%;--size:18px;--dur:32s;--delay:-21s">雨</span>
    <span class="drift" style="--left:69%;--size:32px;--dur:36s;--delay:-32s">诗</span>
    <div class="hero">
      <div class="eyebrow">中文古风字体与排版艺术</div>
      <h1>字在</h1>
      <div class="tagline">字有风骨，自在其间。</div>
      <div class="ornamental-line"></div>
      <div class="subtitle">在字与纸之间，重识中文之美</div>
      <button class="enter" onclick="showView('studio')">入字间 <span class="arrow">→</span></button>
    </div>
    <footer class="home-foot"><span>字 里 有 山 河</span><div class="footlinks"><button onclick="showView('studio');openPanel('fonts')">择字</button><button onclick="showView('studio');openPanel('articles')">阅古</button><button onclick="showView('studio');openPanel('layouts')">观式</button></div><span>ZI ZAI · 2026</span></footer>
  </section>
  <section id="studio" class="studio view" hidden aria-label="赏字工作台">
    <div class="studio-top">
      <div class="selects">
        <button class="toolbar-btn" onclick="openPanel('fonts')"><span id="font-label">汇文明朝体</span><span aria-hidden="true">⌄</span></button>
        <button class="toolbar-btn" onclick="openPanel('articles')"><span id="article-label">项脊轩志</span><span aria-hidden="true">⌄</span></button>
      </div>
      <div class="modes" role="group" aria-label="排版方向">
        <button class="modebtn selected" data-mode="horizontal" onclick="setLayout('horizontal')"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h11"/></svg>横排</button>
        <button class="modebtn" data-mode="vertical" onclick="setLayout('vertical')"><svg class="i" viewBox="0 0 24 24"><path d="M6 4v16M12 4v16M18 4v11"/></svg>竖排</button>
      </div>
    </div>
    <main class="workspace" id="workspace">
      <div class="sheet" id="sheet" data-layout="horizontal"><div class="sheet-inner"><div class="article-head"><h2 id="article-title">项脊轩志</h2><div class="author" id="article-author">归有光</div></div><div class="vertical-title" id="vertical-title">项脊轩志</div><div class="prose" id="prose"></div></div></div>
      <aside class="side-rail" aria-label="赏字工具">
        <button class="rail-btn" onclick="openPanel('fonts')"><svg class="i" viewBox="0 0 24 24"><path d="m4 19 8-15 8 15M7 14h10"/></svg>字体</button>
        <button class="rail-btn" onclick="openPanel('articles')"><svg class="i" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1ZM12 6v14"/></svg>文选</button>
        <button class="rail-btn" onclick="openPanel('layouts')"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>版式</button>
        <button class="rail-btn" onclick="openPanel('settings')"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M9 4v6M15 14v6"/></svg>排版</button>
        <button class="rail-btn" onclick="openPanel('write')"><svg class="i" viewBox="0 0 24 24"><path d="m4 20 5-.9L20 8l-4-4L5 15l-1 5ZM14 6l4 4"/></svg>题写</button>
        <button class="rail-btn" onclick="openPanel('compare')"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="16" rx="1"/><rect x="13" y="4" width="8" height="16" rx="1"/></svg>对照</button>
        <button class="rail-btn" onclick="openPanel('bookmarks')"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h14v17l-7-4-7 4z"/></svg>收藏</button>
      </aside>
    </main>
    <div class="studio-foot"><div class="step-control"><button onclick="cycleArticle(-1)" title="上一篇">‹</button><span id="page-counter">1 / 3</span><button onclick="cycleArticle(1)" title="下一篇">›</button></div><span>一纸书香 · 任意排版</span><div class="type-control"><span>A−</span><input type="range" aria-label="字号" id="quick-size" min="15" max="30" value="20" oninput="changeSize(this.value)"/><span>A+</span></div></div>
  </section>
</div>
<div class="scrim" id="scrim" onclick="closePanel()"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="功能面板" aria-hidden="true"><div class="drawer-head"><h3 id="drawer-title">择字</h3><button class="icon-btn" aria-label="关闭" onclick="closePanel()">✕</button></div><div class="drawer-body" id="drawer-body"></div></aside>
<script>
  const articles=[
    {id:'xiangji',title:'项脊轩志',author:'归有光',category:'散文',paras:['项脊轩，旧南阁子也。室仅方丈，可容一人居。百年老屋，尘泥渗漉，雨泽下注；每移案，顾视无可置者。又北向，不能得日，日过午已昏。余稍为修葺，使不上漏。','前辟四窗，垣墙周庭，以当南日，日影反照，室始洞然。又杂植兰桂竹木于庭，旧时栏楯，亦遂增胜。','借书满架，偃仰啸歌，冥然兀坐，万籁有声；而庭阶寂寂，小鸟时来啄食，人至不去。三五之夜，明月半墙，桂影斑驳，风移影动，珊珊可爱。']},
    {id:'chibi',title:'前赤壁赋',author:'苏轼',category:'赋',paras:['壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。清风徐来，水波不兴。','举酒属客，诵明月之诗，歌窈窕之章。少焉，月出于东山之上，徘徊于斗牛之间。','白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止。']},
    {id:'yueyang',title:'岳阳楼记',author:'范仲淹',category:'散文',paras:['庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴。乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上。','予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。','此则岳阳楼之大观也，前人之述备矣。']}
  ];
  const fonts=[{id:'ming',name:'汇文明朝体',note:'明朝风格 · 端正清雅',family:'"Noto Serif CJK SC", "Songti SC", SimSun, serif',sample:'山月清风'},{id:'kai',name:'清雅楷体（示意）',note:'楷书风格 · 温润舒展',family:'"KaiTi", "STKaiti", serif',sample:'竹影横斜'},{id:'song',name:'传统宋体（示意）',note:'宋体风格 · 适合正文',family:'"SimSun", "Songti SC", serif',sample:'纸上春秋'}];
  let state={view:'home',font:0,article:0,layout:'horizontal',size:20,lineHeight:2.2,custom:null,compare:false};
  function showView(v){state.view=v;document.getElementById('home').hidden=v!=='home';document.getElementById('studio').hidden=v!=='studio';['home','studio'].forEach(x=>document.getElementById('nav-'+x).classList.toggle('active',v===x));closePanel(); if(v==='studio')renderArticle();}
  function currentArticle(){return state.custom?{title:'自定文字',author:'由你题写',paras:state.custom.split(/\n+/).filter(Boolean)}:articles[state.article]}
  function renderArticle(){const a=currentArticle();document.getElementById('font-label').textContent=fonts[state.font].name;document.getElementById('article-label').textContent=a.title;document.getElementById('article-title').textContent=a.title;document.getElementById('article-author').textContent=a.author;document.getElementById('vertical-title').textContent=a.title;const prose=document.getElementById('prose');prose.replaceChildren(...a.paras.map(p=>{const node=document.createElement('p');node.textContent=p;return node}));prose.style.fontFamily=fonts[state.font].family;document.getElementById('sheet').dataset.layout=state.layout;document.getElementById('sheet').style.setProperty('--font-size',state.size+'px');document.getElementById('sheet').style.setProperty('--line-height',state.lineHeight);document.getElementById('page-counter').textContent=state.custom?'自定':(state.article+1)+' / '+articles.length;document.querySelectorAll('.modebtn').forEach(x=>x.classList.toggle('selected',x.dataset.mode===state.layout));document.getElementById('quick-size').value=state.size;document.getElementById('sheet').scrollTop=0;}
  function setLayout(layout){state.layout=layout;state.compare=false;restoreSheet();renderArticle()}
  function changeSize(size){state.size=Number(size);document.getElementById('sheet').style.setProperty('--font-size',size+'px');let output=document.getElementById('size-out');if(output)output.textContent=size+'px'}
  function cycleArticle(delta){state.custom=null;state.article=(state.article+delta+articles.length)%articles.length;renderArticle()}
  function restoreSheet(){const ws=document.getElementById('workspace');const sheet=document.getElementById('sheet');if(!ws.contains(sheet)){ws.insertBefore(sheet,ws.firstChild);document.getElementById('compare-view')?.remove()}sheet.style.display=''}
  function openPanel(type){const titles={fonts:'择字 · 字体图鉴',articles:'文选 · 古文选集',layouts:'版式 · 纸上章法',settings:'排版 · 字间尺度',write:'题写 · 自定文字',compare:'对照 · 两字体',bookmarks:'收藏 · 私人笺册',about:'关于 · 字在'};document.getElementById('drawer-title').textContent=titles[type];const body=document.getElementById('drawer-body');body.replaceChildren();body.innerHTML=panelHTML(type);document.getElementById('scrim').classList.add('visible');document.getElementById('drawer').classList.add('open');document.getElementById('drawer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
  function closePanel(){document.getElementById('scrim').classList.remove('visible');document.getElementById('drawer').classList.remove('open');document.getElementById('drawer').setAttribute('aria-hidden','true');document.body.style.overflow=''}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
  function panelHTML(type){switch(type){
    case 'fonts':return `<div class="muted">挑选字形，感受不同笔意与气韵。此设计稿使用系统字体模拟效果，正式开发请接入已核实授权的真实字体文件。</div><div class="menu-list">${fonts.map((f,i)=>`<button class="menu-item ${state.font===i?'active':''}" onclick="chooseFont(${i})"><div><span>${f.name}</span><small>${f.note}</small></div><strong style="font-family:${f.family}">${f.sample.slice(0,2)}</strong></button>`).join('')}</div><div class="form-row"><button class="action secondary" onclick="openPanel('about')">查看字体来源说明 →</button></div>`;
    case 'articles':return `<div class="muted">选一篇古文，让文字与字体相遇。</div><div class="menu-list">${articles.map((a,i)=>`<button class="menu-item ${state.article===i&&!state.custom?'active':''}" onclick="chooseArticle(${i})"><div><span>${a.title}</span><small>${a.author} · ${a.category}</small></div><strong>↗</strong></button>`).join('')}</div><div class="form-row"><button class="action secondary" onclick="openPanel('write')">题写自己的文字 →</button></div>`;
    case 'layouts':return `<div class="muted">同一段文字，横竖之间自有不同的节奏。</div><div class="menu-list"><button class="menu-item ${state.layout==='horizontal'?'active':''}" onclick="chooseLayout('horizontal')"><div><span>现代横排</span><small>从左至右，适合长篇阅读</small></div><strong>☰</strong></button><button class="menu-item ${state.layout==='vertical'?'active':''}" onclick="chooseLayout('vertical')"><div><span>传统竖排</span><small>自上而下、从右至左</small></div><strong>║</strong></button></div><p class="muted" style="margin-top:24px">册页、对联与题签等特殊版式将在后续开发阶段加入，不作为独立页面。</p>`;
    case 'settings':return `<div class="muted">细调字距与行气。变动会直接反映在书页上。</div><div class="form-row"><label>字号 <b id="size-out">${state.size}px</b></label><input type="range" min="15" max="30" value="${state.size}" oninput="changeSize(this.value)"/></div><div class="form-row"><label>行高 <b id="line-out">${state.lineHeight.toFixed(1)}</b></label><input type="range" min="1.5" max="3.0" step="0.1" value="${state.lineHeight}" oninput="changeLineHeight(this.value)"/></div><div class="form-row"><label>纸张</label><div class="choice-row"><button class="chip active">素宣</button><button class="chip" title="后续阶段开放" disabled>旧纸（规划中）</button></div></div>`;
    case 'write':return `<div class="muted">写下你自己的文字，立即以选定字体与版式呈现。</div><div class="form-row"><textarea class="field" id="draft-text" placeholder="山有木兮木有枝，心悦君兮君不知。">${escapeHtml(state.custom||'')}</textarea></div><button class="action" onclick="applyWriting()">应用到书页</button> <button class="action secondary" onclick="clearWriting()">恢复古文</button>`;
    case 'compare':return `<div class="muted">用相同的文字并排比较两种字体。本设计稿提供基础示意，完整滚动同步作为后续实现项。</div><div class="form-row"><button class="action" onclick="toggleCompare()">${state.compare?'退出对照':'进入对照模式'}</button></div><p class="tiny">对照模式不另开页面，阅读区域临时变为双栏。</p>`;
    case 'bookmarks':{let bk;try{bk=JSON.parse(localStorage.getItem('zizai-bookmarks')||'[]')}catch(e){bk=[]}return `<div class="muted">将喜欢的字形与文章搭配收入个人笺册。本地浏览器保存，不需要账号。</div><div class="form-row"><button class="action" onclick="addBookmark()">收藏当前搭配</button></div><div class="menu-list">${bk.length?bk.map((b,i)=>`<button class="menu-item" onclick="restoreBookmark(${i})"><div><span>${b.article}</span><small>${b.font} · ${b.layout==='vertical'?'竖排':'横排'}</small></div><strong>↗</strong></button>`).join(''):'<div class="empty">尚无收藏</div>'}</div>`}
    case 'about':return `<div class="detail-name">字在</div><p class="muted">字有风骨，自在其间。</p><div class="info-pair"><span class="k">定位</span><span>中文古风字体与排版艺术体验馆</span></div><div class="info-pair"><span class="k">现状</span><span>交互设计稿，非正式产品</span></div><div class="info-pair"><span class="k">字形</span><span>浏览器以系统字体近似模拟；真实字体授权与资源尚需审核</span></div><div class="info-pair"><span class="k">原仓库</span><span>github.com/wxyhaha/fontCollections</span></div><p class="tiny" style="margin-top:30px">设计文档与开发提示词随交付包提供。</p>`;
    default:return ''}}
  function chooseFont(i){state.font=i;renderArticle();openPanel('fonts')}
  function chooseArticle(i){state.article=i;state.custom=null;renderArticle();closePanel()}
  function chooseLayout(layout){setLayout(layout);closePanel()}
  function changeLineHeight(v){state.lineHeight=Number(v);document.getElementById('sheet').style.setProperty('--line-height',v);document.getElementById('line-out').textContent=Number(v).toFixed(1)}
  function applyWriting(){const v=document.getElementById('draft-text').value.trim();if(v){state.custom=v;renderArticle();closePanel()}}
  function clearWriting(){state.custom=null;renderArticle();closePanel()}
  function toggleCompare(){state.compare=!state.compare;restoreSheet();if(state.compare){const view=document.createElement('div');view.className='compare-view';view.id='compare-view';const a=currentArticle();view.innerHTML=`<div class="compare-sheet"><h3>汇文明朝体</h3>${a.paras.map(p=>`<p></p>`).join('')}</div><div class="compare-sheet kaiti"><h3>清雅楷体（示意）</h3>${a.paras.map(p=>`<p></p>`).join('')}</div>`;for(const block of view.children){[...block.querySelectorAll('p')].forEach((node,i)=>node.textContent=a.paras[i])}document.getElementById('sheet').style.display='none';document.getElementById('workspace').insertBefore(view,document.getElementById('sheet'))}closePanel()}
  function getBookmarks(){try{return JSON.parse(localStorage.getItem('zizai-bookmarks')||'[]')}catch(e){return []}}
  function addBookmark(){const bk=getBookmarks();bk.push({font:fonts[state.font].name,fontIndex:state.font,article:currentArticle().title,articleIndex:state.article,layout:state.layout,size:state.size,custom:state.custom});localStorage.setItem('zizai-bookmarks',JSON.stringify(bk));openPanel('bookmarks')}
  function restoreBookmark(i){const b=getBookmarks()[i];if(!b)return;state.font=b.fontIndex;state.article=b.articleIndex;state.layout=b.layout;state.size=b.size;state.custom=b.custom;renderArticle();closePanel()}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});renderArticle();
</script>
</body>
</html>
